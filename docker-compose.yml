networks:
  buildr_network:
    driver: bridge

services:
  buildr-dashboard:
    container_name: buildr-dashboard
    build:
      context: .
      target: development
    ports:
      - "${PORT:-3002}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next
    stdin_open: true
    tty: true
    networks:
      - buildr_network
