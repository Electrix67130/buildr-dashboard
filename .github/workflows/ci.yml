# Verification continue Buildr — dashboard.
# Sur chaque pull request : typage, tests et build, sans deploiement. Le push
# sur main passe par deploy.yml, qui refait les memes verifications.
name: CI dashboard

on:
  pull_request: {}

jobs:
  check:
    name: Typecheck + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
